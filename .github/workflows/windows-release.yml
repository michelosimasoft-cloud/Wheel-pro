name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/release-request"]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run regression tests
        run: dotnet run --project tests/WheelPro.RegressionTests/WheelPro.RegressionTests.csproj -c Release
      - name: Install matching Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0
      - name: Restore, publish and package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Upload release assets for signing/review
        uses: actions/upload-artifact@v4
        with:
          name: WheelPro-windows
          path: artifacts/releases/*
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content WheelPro/WheelPro.csproj)).Project.PropertyGroup.Version
          $tag = "v$version"
          if (gh release view $tag 2>$null) {
            gh release upload $tag artifacts/releases/* --clobber
          } else {
            gh release create $tag artifacts/releases/* --target $env:GITHUB_SHA --title "Wheel Pro $version" --generate-notes
          }
