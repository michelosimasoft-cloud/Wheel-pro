name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run regression tests
        run: dotnet run --project tests/WheelPro.RegressionTests/WheelPro.RegressionTests.csproj -c Release
      - name: Install matching Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0
      - name: Restore, publish and package
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Upload release assets for signing/review
        uses: actions/upload-artifact@v4
        with:
          name: WheelPro-windows
          path: artifacts/releases/*
          if-no-files-found: error
