<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wheel Pro</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050609; color: #f5f7fb; font-family: Inter, "Segoe UI", sans-serif; }
    header { height: 76px; display: flex; align-items: center; padding: 0 28px; border-bottom: 1px solid #171b26; }
    form { width: min(760px, 100%); display: flex; gap: 10px; }
    input { width: 100%; height: 44px; border: 1px solid #272e3f; border-radius: 9px; background: #0e1118; color: #f5f7fb; padding: 0 15px; font-size: 14px; outline: none; transition: border-color .18s, box-shadow .18s; }
    input::placeholder { color: #778197; }
    input:focus { border-color: #5b7cff; box-shadow: 0 0 0 3px #5b7cff22; }
    button { height: 44px; border: 0; border-radius: 9px; background: #5877f7; color: white; padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #6c87ff; }
    #result { display: none; max-width: 760px; margin: 42px 28px; color: #9da8bd; font-size: 14px; }
    #result strong { color: #f5f7fb; font-weight: 600; }
    @media (max-width: 600px) { header { padding: 16px; } #result { margin: 32px 16px; } button { padding: 0 14px; } }
  </style>
</head>
<body>
  <header>
    <form id="wheelSearch">
      <input id="searchInput" type="search" autocomplete="off" aria-label="Search for wheel" placeholder="Search for wheel">
      <button type="submit">Search</button>
    </form>
  </header>

  <main id="result" aria-live="polite"></main>

  <script>
    const knownBrands = ['Thrustmaster', 'Logitech', 'Fanatec', 'MOZA', 'Simucube', 'Asetek', 'Cammus', 'PXN', 'HORI', 'Turtle Beach'];
    document.getElementById('wheelSearch').addEventListener('submit', (event) => {
      event.preventDefault();
      const search = document.getElementById('searchInput').value.trim();
      if (!search) return;
      const brand = knownBrands.find((name) => search.toLowerCase().includes(name.toLowerCase()));
      const result = document.getElementById('result');
      result.style.display = 'block';
      result.innerHTML = brand
        ? `<strong>${search}</strong> found. Loading its wheel profile…`
        : `<strong>${search}</strong> will open with the generic HID wheel profile.`;
    });
  </script>
</body>
</html>
